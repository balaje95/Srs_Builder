<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Zuper CPQ Builder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Dark theme ── */
:root,[data-theme="dark"]{
  --bg-page:#0a1520;
  --bg:#0f1e2e;--bg2:#162436;--bg3:#1e3347;--bg4:#253d57;
  --tx:#e5e0df;--txd:#7a99af;--txdd:#2e4558;
  --bd:rgba(232,98,42,.22);
  --bdd:rgba(255,255,255,.09);--bdd2:rgba(255,255,255,.045);
  --inp-bg:#162436;--inp-bd:rgba(255,255,255,.12);
  --scrl:#253d57;--shadow:0 4px 28px rgba(0,0,0,.55);
  --hvr:rgba(255,255,255,.04);
  --sel-bg:rgba(232,98,42,.09);--sel-bd:rgba(232,98,42,.4);
  --pill-bg:#1e3347;--pill-bd:rgba(255,255,255,.1);--pill-tx:#7a99af;
  --pill-a-bg:rgba(232,98,42,.18);--pill-a-bd:rgba(232,98,42,.5);--pill-a-tx:#fb923c;
  --stat-bg:#162436;--phase-bg:#162436;
  --chip-bg:#1e3347;--chip-bd:rgba(34,197,94,.3);
  --tm-g:rgba(34,197,94,.07);--tm-g-bd:rgba(34,197,94,.2);--tm-g-tx:#22c55e;
  --tm-b:rgba(232,98,42,.08);--tm-b-bd:rgba(232,98,42,.22);--tm-b-tx:#fb923c;
  --tm-p:rgba(167,139,250,.07);--tm-p-bd:rgba(167,139,250,.2);--tm-p-tx:#a78bfa;
  --ok-bg:rgba(34,197,94,.09);--ok-bd:rgba(34,197,94,.25);--ok-tx:#22c55e;
  --er-bg:rgba(248,113,113,.07);--er-bd:rgba(248,113,113,.2);--er-tx:#f87171;
  --hl-bg:rgba(232,98,42,.3);--hl-tx:#ffb89a;
}

/* ── Light theme ── */
[data-theme="light"]{
  --bg-page:#e8eef6;
  --bg:#ffffff;--bg2:#f4f7fb;--bg3:#eaeef5;--bg4:#dce4f0;
  --tx:#1a2535;--txd:#536070;--txdd:#b8c6d0;
  --bd:rgba(232,98,42,.28);
  --bdd:rgba(0,0,0,.1);--bdd2:rgba(0,0,0,.055);
  --inp-bg:#ffffff;--inp-bd:rgba(0,0,0,.18);
  --scrl:#c5d0de;--shadow:0 2px 20px rgba(0,0,0,.1);
  --hvr:rgba(0,0,0,.03);
  --sel-bg:rgba(232,98,42,.06);--sel-bd:rgba(232,98,42,.4);
  --pill-bg:#eaeef5;--pill-bd:rgba(0,0,0,.14);--pill-tx:#536070;
  --pill-a-bg:rgba(232,98,42,.1);--pill-a-bd:rgba(232,98,42,.45);--pill-a-tx:#c84f1e;
  --stat-bg:#f4f7fb;--phase-bg:#f4f7fb;
  --chip-bg:#eaeef5;--chip-bd:rgba(34,197,94,.4);
  --tm-g:rgba(34,197,94,.07);--tm-g-bd:rgba(34,197,94,.3);--tm-g-tx:#16a34a;
  --tm-b:rgba(232,98,42,.07);--tm-b-bd:rgba(232,98,42,.28);--tm-b-tx:#c84f1e;
  --tm-p:rgba(139,92,246,.07);--tm-p-bd:rgba(139,92,246,.25);--tm-p-tx:#7c3aed;
  --ok-bg:rgba(34,197,94,.07);--ok-bd:rgba(34,197,94,.3);--ok-tx:#16a34a;
  --er-bg:rgba(239,68,68,.07);--er-bd:rgba(239,68,68,.25);--er-tx:#dc2626;
  --hl-bg:rgba(232,98,42,.22);--hl-tx:#92300a;
}

/* ── Brand accent (always fixed) ── */
:root{
  --or:#e8622a;--or2:#c84f1e;--or3:rgba(232,98,42,.14);
  --gr:#22c55e;--am:#f59e0b;--re:#f87171;--pu:#a78bfa;--bl:#38bdf8;
  --r4:4px;--r6:6px;--r8:8px;--r10:10px;--r12:12px;
}

html,body{min-height:100%;background:var(--bg-page);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--tx);font-size:14px;line-height:1.5;transition:background .22s,color .18s}
.app{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--bg);border:1px solid var(--bdd);border-radius:var(--r12);overflow:hidden;box-shadow:var(--shadow);transition:background .22s,border-color .18s}

/* Header */
.hd{background:var(--bg2);border-bottom:1px solid var(--bd);padding:11px 18px;display:flex;align-items:center;gap:10px}
.logo{background:var(--or);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:.06em;flex-shrink:0;user-select:none}
.hd-t{font-size:12px;color:var(--txd);flex:1}
.acc-chip{display:flex;align-items:center;gap:5px;background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:20px;padding:3px 10px;flex-shrink:0}
.acc-dot{width:6px;height:6px;border-radius:50%;background:var(--gr);flex-shrink:0}
.acc-nm{font-size:11px;color:var(--ok-tx);white-space:nowrap;font-weight:500}
.theme-btn{background:var(--bg3);border:1px solid var(--bdd);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--txd);transition:all .2s;flex-shrink:0;white-space:nowrap}
.theme-btn:hover{border-color:var(--or);color:var(--or);background:var(--bg4)}

/* Steps */
.steps{display:flex;background:var(--bg2);border-bottom:1px solid var(--bdd)}
.step{flex:1;display:flex;align-items:center;gap:7px;padding:10px 13px;font-size:11px;color:var(--txd);border-right:1px solid var(--bdd);cursor:pointer;user-select:none;transition:background .15s;overflow:hidden}
.step:last-child{border-right:none}
.step.on{background:var(--bg3);color:var(--tx)}
.step.done{color:var(--ok-tx)}
.step.done:hover{background:var(--bg3)}
.step.lk{cursor:default;opacity:.4;pointer-events:none}
.sn{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:var(--bg3);border:1px solid var(--bdd);flex-shrink:0;transition:all .15s}
.step.on .sn{background:var(--or);border-color:var(--or);color:#fff}
.step.done .sn{background:var(--gr);border-color:var(--gr);color:#fff}

/* Body */
.body{padding:20px;min-height:500px}
.lbl{font-size:10px;color:var(--txd);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.hint{font-size:12px;color:var(--txd);line-height:1.6}
.dv{height:1px;background:var(--bdd);margin:10px 0}

/* Inputs */
.inp{width:100%;background:var(--inp-bg);border:1px solid var(--inp-bd);color:var(--tx);border-radius:var(--r6);padding:8px 11px;font-size:13px;outline:none;transition:border .15s,background .15s}
.inp:focus{border-color:var(--or)}
.inp::placeholder{color:var(--txdd)}
.sel{width:100%;background:var(--inp-bg);border:1px solid var(--inp-bd);color:var(--tx);border-radius:var(--r6);padding:8px 11px;font-size:13px;outline:none;cursor:pointer;transition:border .15s}
.sel:focus{border-color:var(--or)}
.sel option{background:var(--inp-bg);color:var(--tx)}
.pw-wr{position:relative}
.pw-wr .inp{padding-right:44px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txd);cursor:pointer;font-size:11px;padding:2px;transition:color .15s}
.pw-eye:hover{color:var(--or)}

/* Buttons */
.btn{background:var(--or);color:#fff;border:none;border-radius:var(--r6);padding:8px 16px;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--or2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-g{background:transparent;color:var(--txd);border:1px solid var(--bdd);border-radius:var(--r6);padding:8px 14px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-g:hover{border-color:var(--or);color:var(--or)}
.btn-g:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:4px 9px!important;font-size:11px!important}
.btn-ico{background:var(--bg3);border:1px solid var(--bdd);color:var(--txd);border-radius:var(--r4);padding:4px 9px;font-size:11px;cursor:pointer;transition:all .12s}
.btn-ico:hover{border-color:var(--or);color:var(--or)}

/* Nav bar */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--bdd)}
.nav-i{font-size:11px;color:var(--txd)}

/* Tags/badges */
.tag{font-size:10px;background:var(--or3);color:var(--or);border:1px solid rgba(232,98,42,.3);border-radius:3px;padding:1px 7px}
.badge{font-size:9px;font-weight:600;border-radius:3px;padding:1px 6px;letter-spacing:.04em}
.bg-good{background:rgba(34,197,94,.1);color:var(--tm-g-tx);border:1px solid var(--tm-g-bd)}
.bg-better{background:rgba(232,98,42,.1);color:var(--tm-b-tx);border:1px solid var(--tm-b-bd)}
.bg-best{background:rgba(167,139,250,.1);color:var(--tm-p-tx);border:1px solid var(--tm-p-bd)}
.bg-std{background:rgba(56,189,248,.08);color:var(--bl);border:1px solid rgba(56,189,248,.2)}
.kpill{font-size:10px;background:var(--pill-bg);border:1px solid var(--pill-bd);border-radius:3px;padding:1px 6px;color:var(--pill-tx)}

/* Alerts */
.a-ok{padding:8px 12px;background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:var(--r6);font-size:12px;color:var(--ok-tx)}
.a-err{padding:8px 12px;background:var(--er-bg);border:1px solid var(--er-bd);border-radius:var(--r6);font-size:12px;color:var(--er-tx);margin-top:8px}

/* Helpers */
.row{display:flex;gap:8px;align-items:center}
.nodata{text-align:center;padding:40px;color:var(--txd);font-size:13px}

/* Stats */
.stats{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;background:var(--stat-bg);border:1px solid var(--bdd);border-radius:var(--r8);padding:9px 10px;text-align:center}
.stat-n{font-size:20px;font-weight:500;color:var(--or)}
.stat-l{font-size:10px;color:var(--txd);margin-top:1px}

/* Brand pills */
.bpills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.bp-lbl{font-size:10px;color:var(--txd);white-space:nowrap;flex-shrink:0}
.bp{font-size:11px;background:var(--pill-bg);border:1px solid var(--pill-bd);border-radius:20px;padding:3px 10px;color:var(--pill-tx);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.bp:hover{border-color:var(--or);color:var(--or)}
.bp.on{background:var(--pill-a-bg);border-color:var(--pill-a-bd);color:var(--pill-a-tx);font-weight:500}

/* Filter row */
.frow{display:grid;grid-template-columns:1fr 155px 140px 110px;gap:8px;margin-bottom:6px}
.sw{position:relative}
.sw .inp{padding-left:32px;padding-right:36px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--txd);font-size:15px;pointer-events:none;line-height:1}
.scl{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--bg3);border:1px solid var(--bdd);border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;color:var(--txd);display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.scl:hover{background:var(--or);border-color:var(--or);color:#fff}

/* Active filter chips */
.fbar{display:flex;align-items:center;gap:5px;min-height:28px;margin-bottom:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--pill-a-bg);border:1px solid var(--pill-a-bd);color:var(--pill-a-tx);border-radius:20px;padding:2px 8px 2px 9px;font-size:11px}
.fchip-x{background:none;border:none;cursor:pointer;color:inherit;font-size:13px;line-height:1;padding:0;opacity:.7}
.fchip-x:hover{opacity:1}
.f-clr{font-size:11px;color:var(--txd);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:2px}
.f-clr:hover{color:var(--or)}
.fbar-empty{font-size:11px;color:var(--txdd)}

/* Product list */
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.pmeta-t{font-size:11px;color:var(--txd)}
.sbox{border:1px solid var(--bdd);border-radius:var(--r8);overflow-y:auto;max-height:305px}
.sbox::-webkit-scrollbar{width:4px}
.sbox::-webkit-scrollbar-thumb{background:var(--scrl);border-radius:2px}
.prow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--bdd2);cursor:pointer;transition:background .1s}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--hvr)}
.prow.on{background:var(--sel-bg)}
.pck{width:15px;height:15px;border:1.5px solid var(--bdd);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;transition:all .12s}
.prow.on .pck{background:var(--or);border-color:var(--or)}
.pn{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;color:var(--tx)}
.hl{background:var(--hl-bg);color:var(--hl-tx);border-radius:2px;padding:0 1px}
.ptags{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.ppr{font-size:12px;font-weight:500;color:var(--or);white-space:nowrap;flex-shrink:0;margin-left:8px}

/* Pagination */
.pg{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdd)}
.pg-n{font-size:11px;color:var(--txd);min-width:64px;text-align:center}

/* Progress */
.pw-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:6px 0}
.pb{height:100%;background:linear-gradient(90deg,var(--or),#f97316);border-radius:2px;transition:width .4s}

/* Line items */
.lir{padding:11px 13px;border-bottom:1px solid var(--bdd2)}
.lir:last-child{border-bottom:none}
.li-ok{font-size:10px;color:var(--ok-tx);background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:3px;padding:1px 6px;margin-left:auto;flex-shrink:0}
.li-gt{font-size:10px;color:var(--am);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:3px;padding:1px 6px}
.fml{font-size:10px;color:var(--or);font-family:monospace;background:var(--or3);padding:2px 7px;border-radius:3px;display:inline-block;word-break:break-all}

/* Tier cards */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tc{background:var(--bg2);border:1.5px solid var(--bdd);border-radius:var(--r10);padding:15px;display:flex;flex-direction:column;position:relative;transition:border .2s,background .2s}
.tc-b{border-color:var(--or)!important}
.tc-p{border-color:rgba(167,139,250,.45)!important}
.tbdg{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10px;padding:2px 10px;border-radius:10px;white-space:nowrap;font-weight:600;color:#fff}
.tnm{font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.tpr{font-size:24px;font-weight:500;margin:4px 0 2px}
.tsb{font-size:11px;color:var(--txd);margin-bottom:10px}
.tw{font-size:10px;padding:4px 8px;border-radius:5px;margin-bottom:10px;line-height:1.5}
.tw-g{background:var(--tm-g);color:var(--tm-g-tx);border:1px solid var(--tm-g-bd)}
.tw-b{background:var(--tm-b);color:var(--tm-b-tx);border:1px solid var(--tm-b-bd)}
.tw-p{background:var(--tm-p);color:var(--tm-p-tx);border:1px solid var(--tm-p-bd)}
.tds{font-size:11px;color:var(--txd);margin-bottom:10px;line-height:1.5}
.tf{font-size:11px;color:var(--txd);padding:4px 0;border-bottom:1px solid var(--bdd2);display:flex;align-items:flex-start;gap:5px}
.tf:last-of-type{border-bottom:none}
.tpi{border-top:1px solid var(--bdd);padding-top:8px;margin-top:8px}
.tpi-r{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:10px;color:var(--txd)}
.tbtn{margin-top:auto;padding-top:12px;width:100%;font-size:12px}

/* Sqft bar */
.sqbar{display:flex;align-items:center;gap:10px;background:var(--bg2);padding:10px 14px;border-radius:var(--r8);border:1px solid var(--bdd);margin-bottom:14px;flex-wrap:wrap}
.sqbar label{font-size:11px;color:var(--txd);white-space:nowrap}
.sqbar .inp{width:88px;text-align:center;padding:5px 8px}
.sqbar .sel{width:auto}

/* Import */
.iphase{background:var(--phase-bg);border:1px solid var(--bdd);border-radius:var(--r8);padding:12px;margin-bottom:8px}
.phdr{display:flex;align-items:center;gap:10px}
.pnum{width:22px;height:22px;border-radius:50%;background:var(--bg3);border:1px solid var(--bdd);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.pnum.act{background:var(--or);border-color:var(--or);color:#fff}
.pnum.dn{background:var(--gr);border-color:var(--gr);color:#fff}
.ptit{font-size:13px;font-weight:500;flex:1;color:var(--tx)}
.pst{font-size:11px}
.rrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;border-bottom:1px solid var(--bdd2)}
.rrow:last-child{border-bottom:none}
.rok{color:var(--gr)}
.rfail{color:var(--re)}

/* Auth chip */
.ach{background:var(--chip-bg);border:1px solid var(--chip-bd);border-radius:var(--r8);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-top:14px}
.adot{width:7px;height:7px;border-radius:50%;background:var(--gr);flex-shrink:0}

/* Loader */
.ld{display:flex;align-items:center;gap:6px;color:var(--txd);font-size:12px}
.da{width:5px;height:5px;background:var(--or);border-radius:50%;animation:pp 1s infinite}
.da:nth-child(2){animation-delay:.2s}
.da:nth-child(3){animation-delay:.4s}
@keyframes pp{0%,100%{opacity:.3}50%{opacity:1}}

/* ── Internal tool banner ── */
.internal-banner{width:100%;max-width:1100px;margin:0 auto 10px;display:flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(232,98,42,.08);border:1px solid rgba(232,98,42,.2);border-radius:var(--r6);font-size:11px;color:var(--or);font-weight:500}
.internal-banner svg{flex-shrink:0}

/* ── Mapping summary panel ── */
.map-summary{background:var(--bg2);border:1px solid var(--bdd);border-radius:var(--r8);padding:12px 14px;margin-bottom:12px}
.map-summary-title{font-size:10px;color:var(--txd);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.map-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.ms-cell{background:var(--bg3);border:1px solid var(--bdd);border-radius:var(--r6);padding:8px 10px;text-align:center}
.ms-n{font-size:18px;font-weight:600;color:var(--tx)}
.ms-n.ok{color:var(--gr)}
.ms-n.warn{color:var(--am)}
.ms-n.info{color:var(--bl)}
.ms-l{font-size:10px;color:var(--txd);margin-top:2px;line-height:1.3}
.formula-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.formula-chip-item{font-size:10px;background:var(--or3);border:1px solid rgba(232,98,42,.22);color:var(--or);border-radius:4px;padding:2px 8px;font-family:monospace;display:flex;align-items:center;gap:5px}
.fci-count{background:rgba(232,98,42,.2);border-radius:3px;padding:0 4px;font-size:9px;font-weight:700}

/* ── Info Modal ── */
.info-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.info-modal{background:var(--bg);border:1px solid var(--bdd);border-radius:var(--r12);width:100%;max-width:860px;box-shadow:0 24px 64px rgba(0,0,0,.28);position:relative}
.info-modal-hd{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--bdd);position:sticky;top:0;background:var(--bg);z-index:1;border-radius:var(--r12) var(--r12) 0 0}
.info-modal-hd h2{margin:0;font-size:16px;font-weight:700;color:var(--tx);flex:1}

/* Return the hardcoded formula definition for a line-item display name, or null */
function findHardcodedFormula(displayName){
  return HARDCODED_FORMULAS.find(hf=>hf.match(displayName))||null;
}

/* Build expression_map for a hardcoded formula given the account's resolved tokens.
   wasteOverride: {shingles, underlayment, starter, other} from user input in Step 3 */
function buildHardcodedFormula(hf, toks, displayName, wasteOverride){
  const em=[];
  const tokensNeeded=[...hf.tokens];
  // If formula needs waste % AND user has set an override, inline it as a constant
  // instead of referencing the measurement token — more predictable results
  const wasteTokenIdx=tokensNeeded.indexOf('Suggested Waste Percentage %');
  let exprOverride=hf.expr;
  if(wasteTokenIdx!==-1&&wasteOverride){
    // Determine which category this product belongs to
    const dn=(displayName||'').toLowerCase();
    const wasteVal=
      /shingle|shingles/i.test(dn)?wasteOverride.shingles:
      /underlayment|underlay/i.test(dn)?wasteOverride.underlayment:
      /starter/i.test(dn)?wasteOverride.starter:
      wasteOverride.other;
    if(wasteVal!=null){
      // Replace the waste token placeholder ($N where N = wasteTokenIdx+1) with the literal value
      // We need to build em without the waste entry and adjust expression
      const wastePlaceholder=`$${wasteTokenIdx+1}`;
      // Replace e.g. (1+$2/100) with the literal value: (1+0.12)
      exprOverride=exprOverride.replace(
        new RegExp(`\\(1\\+\\${wastePlaceholder}\\/100\\)`,'g'),
        `(1+${(wasteVal/100).toFixed(4)})`
      ).replace(
        new RegExp(`\\(1\\-\\${wastePlaceholder}\\/100\\)`,'g'),
        `(1-${(wasteVal/100).toFixed(4)})`
      ).replace(new RegExp('\\'+wastePlaceholder,'g'),String(wasteVal));
      // Remove the waste token from the list — it's now inlined
      tokensNeeded.splice(wasteTokenIdx,1);
    }
  }
  // Renumber remaining token placeholders
  let finalExpr=exprOverride;
  const remapping={};
  let newIdx=1;
  for(let i=1;i<=hf.tokens.length;i++){
    const ph=`$${i}`;
    if(finalExpr.includes(ph))remapping[i]=newIdx++;
  }
  for(const[old,nw]of Object.entries(remapping)){
    finalExpr=finalExpr.split(`$${old}`).join(`__${nw}__`);
  }
  finalExpr=finalExpr.replace(/__(\d+)__/g,'$$$1');

  for(let i=0;i<tokensNeeded.length;i++){
    const tok=toks.find(t=>t.name===tokensNeeded[i]);
    if(!tok)return null;
    em.push({key:`$${i+1}`,type:'MEASUREMENT',measurement_token_uid:tok.uid,measurement_category_uid:tok.catUid});
  }
  if(!em.length)return null;
  const ck=displayName.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').substring(0,50)+'_cpq';
  return{formula:{
    formula_name:`${displayName} (CPQ)`,
    formula_key:ck,
    formula_category:'AREA_MEASUREMENT',
    formula_description:`${displayName} — ${hf.note}${wasteOverride?` · waste ${wasteOverride.shingles||wasteOverride.other}%`:''}`,
    formula:{expression:finalExpr,expression_map:em,rounding_mechanism:'NEXT_WHOLE_NUMBER'},
  }};
}

/* helpers */
function normT(t){
  if(!t)return null;const v=t.toLowerCase().trim();
  if(v.includes('good')||v==='standard'||v==='basic'||v==='economy'||v==='1')return'good';
  if(v.includes('better')||v==='mid'||v==='plus'||v==='2')return'better';
  if(v.includes('best')||v==='premium'||v==='elite'||v==='3'||v==='top')return'best';
  return null;
}
function tbc(t){return{good:'badge bg-good',better:'badge bg-better',best:'badge bg-best'}[t]||'badge bg-std';}
function uom(u){if(!u)return'';let v=u;if(typeof v==='string'){try{v=JSON.parse(v);}catch{return String(v);}}if(Array.isArray(v)&&v.length)return v[0]?.uom||v[0]?.unit||String(v[0])||'';if(v&&typeof v==='object')return v.uom||v.unit||Object.values(v)[0]||'';return'';}
function n(s){return(s||'').toLowerCase().trim();}

/* highlight component */
function Hl({text,toks}){
  if(!toks||!toks.length||!text)return React.createElement('span',null,text||'');
  let parts=[text];
  for(const tok of toks){
    if(!tok||tok.length<2)continue;
    const next=[];
    for(const part of parts){
      if(typeof part!=='string'){next.push(part);continue;}
      const lo=part.toLowerCase();let idx=0,out=[];
      while(true){
        const fi=lo.indexOf(tok,idx);
        if(fi===-1){out.push(part.slice(idx));break;}
        if(fi>idx)out.push(part.slice(idx,fi));
        out.push(React.createElement('mark',{key:`m${fi}`,className:'hl'},part.slice(fi,fi+tok.length)));
        idx=fi+tok.length;
      }
      next.push(...out);
    }
    parts=next;
  }
  return React.createElement('span',null,...parts.map((p,i)=>typeof p==='string'?React.createElement('span',{key:i},p):p));
}

/* ── Fuzzy line-item matcher — used as fallback when proposal_line_item field is absent ──
 * Maps roofing product names/categories to the most appropriate proposal line item
 * using keyword patterns that reflect industry standard product → line item relationships.
 */
const FUZZY_PATTERNS=[
  {keys:['shingle','laminate','architectural','3-tab','dimensional','lifetime'],li:'shingle'},
  {keys:['synthetic underlayment','synthetic underlay'],li:'synthetic underlayment'},
  {keys:['underlayment','felt','15lb','30lb'],li:'underlayment'},
  {keys:['ice and water','ice & water','ice/water','i&w shield','ice shield','water shield'],li:'ice'},
  {keys:['starter strip','starter shingle'],li:'starter'},
  {keys:['drip edge','drip-edge','eave flashing'],li:'drip edge'},
  {keys:['ridge vent','hip vent','ridge ventilation'],li:'ridge vent'},
  {keys:['ridge cap','hip cap','hip and ridge','hip & ridge'],li:'ridge cap'},
  {keys:['pipe boot','pipe flash','soil stack','boot flash'],li:'pipe'},
  {keys:['step flashing','counter flash','wall flash'],li:'flash'},
  {keys:['valley','valley flashing','open valley','closed valley'],li:'valley'},
  {keys:['gutter','k-style gutter','half-round gutter'],li:'gutter'},
  {keys:['downspout','leader'],li:'downspout'},
  {keys:['skylight','velux'],li:'skylight'},
  {keys:['chimney','chimney flash'],li:'chimney'},
  {keys:['labor','installation','install labor','roofing labor'],li:'labor'},
  {keys:['tear off','tear-off','removal','haul away','haul-away','disposal'],li:'tear'},
  {keys:['permit','building permit'],li:'permit'},
  {keys:['inspection','inspect'],li:'inspect'},
  {keys:['caulk','sealant','roofing cement'],li:'sealant'},
  {keys:['ice & water','ice and water','icewater'],li:'ice and water'},
];
function fuzzyMatchLI(productName,productCategory,lineItems){
  const pn=n(productName),pc=n(productCategory||'');
  const combined=pn+' '+pc;
  for(const pat of FUZZY_PATTERNS){
    if(pat.keys.some(k=>combined.includes(n(k)))){
      const m=lineItems.find(li=>n(li.display_name).includes(pat.li));
      if(m)return m;
    }
  }
  return null;
}

/* ── Build complete auto-mapping: primary via proposal_line_item, fallback fuzzy ── */
function buildAutoMappings(selProds,lineItems){
  const nm={};
  for(const p of selProds){
    // Primary: exact match on the proposal_line_item field
    if(p.proposal_line_item){
      const m=lineItems.find(li=>n(li.display_name)===n(p.proposal_line_item));
      if(m){nm[p.product_id]=m.id;continue;}
      // Try partial match if exact fails
      const partial=lineItems.find(li=>n(li.display_name).includes(n(p.proposal_line_item))||n(p.proposal_line_item).includes(n(li.display_name)));
      if(partial){nm[p.product_id]=partial.id;continue;}
    }
    // Fallback: keyword-based fuzzy match
    const fuzzy=fuzzyMatchLI(p.product_name,p.product_category,lineItems);
    if(fuzzy)nm[p.product_id]=fuzzy.id;
  }
  return nm;
}

/* ─────────────────────────────────────────────────────────────────────────
   PRODUCT CLASSIFIER — determines if a product should be PARTS, SERVICE, or BUNDLE
   Source: Zuper CPQ spec + roofing industry heuristics from master sheets

   RULES (in priority order):
   1. SERVICE_ONLY  → SKIP entirely (delivery fees, inspections — not a physical product)
   2. PARTS_ONLY    → PARTS (hardware/consumables that never need a labor sibling)
   3. price > $1 + roofing keyword → BUNDLE
   4. price > $1 (any product with real price) → BUNDLE
   5. price = $0 or null → PARTS  ← CRITICAL: user selected it, always import it
      (DO NOT SKIP zero-price products — many catalog items have no price in SRS)
   ───────────────────────────────────────────────────────────────────────── */
// Word boundaries (\b) prevent "nail" matching "NailBase", "can" matching "scan", etc.
const PARTS_ONLY_RE = /\b(nail|screw|fastener|staple|cap nail|ring shank|bolt|washer|rivet|ferrule|grommet|sleeve|applicator|mixer|gun|hose|brush|roller|paddle|bucket|pail|cleaner|solvent|primer spray)\b/i;
const SERVICE_ONLY_RE = /inspection|consultation|assessment|survey|^labor|delivery fee|freight|shipping|disposal|dumpster|permit|warranty|project management|setup fee|mobilization/i;
const BUNDLE_PUSH_RE = /shingle|membrane|underlayment|insulation|ridge|vent|flashing|ice.*water|starter|hip.*ridge|valley.*metal|drip.*edge|soffit|fascia|deck.*armor|felt|siding|panel|board|coating|adhesive|cement|foam.*adhesive|coping|drain|scupper|skylight/i;

function classifyProd(p){
  const name = p.product_name || '';
  const price = parseFloat(p.suggested_price) || 0;
  // 1. Genuine service-type items — skip entirely (not a physical product)
  if(SERVICE_ONLY_RE.test(name)) return 'SKIP';
  // 2. Hardware/consumables — PARTS only (no labor sibling)
  if(PARTS_ONLY_RE.test(name)) return 'PARTS';
  // 3 & 4. Roofing products with real price → BUNDLE
  if(price > 1 && BUNDLE_PUSH_RE.test(name)) return 'BUNDLE';
  if(price > 1) return 'BUNDLE';
  // 5. Zero-price OR unknown price — still import as PARTS
  // NEVER skip user-selected products just because price is $0 in the SRS catalog
  // Many trim, commercial, siding products have no pricing data in SRS
  return 'PARTS';
}

/* ─────────────────────────────────────────────────────────────────────────
   BUNDLE CREATION ENGINE
   Runs AFTER material+labor products exist in Zuper.
   Creates BUNDLE products linking Material UID + Labor UID.
   Always: PARTS → SERVICE → BUNDLE. Never create bundle first.
   ───────────────────────────────────────────────────────────────────────── */
async function runBundleCreate({auth,selProds,um,ulm,signal,onPhase,onLog}){
  const sig=signal||{cancel:false,pause:false};
  const{key,url}=auth,log=m=>onLog&&onLog(m);
  async function chk(){while(sig.pause&&!sig.cancel)await slp(200);if(sig.cancel)throw new Error('CANCELLED');}

  onPhase('bundles','active');
  // Only products where BOTH material AND labor UIDs exist
  const candidates=selProds.filter(p=>{
    if(classifyProd(p)!=='BUNDLE')return false;
    const name=(p.product_name||'').toLowerCase();
    if(/optional|addon|add-on/i.test(name))return false; // spec: skip optional/addon
    return !!(um[p.product_id]&&ulm[p.product_id]);
  });
  log(`Bundle candidates: ${candidates.length} products with both Material + Labor UIDs`);

  if(candidates.length===0){
    onPhase('bundles','done',{success:0,failed:0,skipped:0});
    return{bR:[]};
  }

  // Pre-check existing bundles to avoid duplicates
  const existBundleByExtId={};
  try{
    let pg=1;
    while(true){
      await chk();
      const r=await zf(`${url}product?count=100&page=${pg}`,{headers:zh(key)});
      const items=r.j?.data||[];
      items.forEach(p=>{if(p.product_id&&p.product_uid)existBundleByExtId[p.product_id]=p.product_uid;});
      if(items.length<100)break;pg++;
    }
    log(`Existing products checked for bundle dedup`);
  }catch(e){if(e.message==='CANCELLED')throw e;log('Could not pre-check bundles: '+e.message);}

  const bR=[];let bs=0,bf=0,bReused=0;
  const bErrLog=[];

  for(const p of candidates){
    await chk();
    const extId=`SRS-${p.product_id}-BND`;
    // Dedup check
    if(existBundleByExtId[extId]){
      bR.push({name:p.product_name,uid:existBundleByExtId[extId],ok:true,reused:true});
      bReused++;log(`↺ Reused bundle: ${p.product_name}`);
      continue;
    }
    const matPrice=Math.round((parseFloat(p.suggested_price)||0)*100)/100;
    const payload={product:{
      product_name:p.product_name,
      product_id:extId,
      is_available:true,
      price:matPrice,    // bundle price = material price (labor is $0 for now)
      min_quantity:0,quantity:0,
      product_type:'BUNDLE',pricing_level:'ROLLUP',
      track_quantity:false,has_custom_tax:false,meta_data:[],
      is_billable:true,consider_profitability:true,is_commissionable:true,
      location_availability:[],
      tax:{tax_exempt:false},product_files:[],
      option:{customer_selection:false,option_label:'Option',option_values:[]},
      associated_products:[
        {product_uid:um[p.product_id],  quantity:1,price:matPrice,purchase_price:0,preferred_product:false},
        {product_uid:ulm[p.product_id], quantity:1,price:0,        purchase_price:0,preferred_product:false},
      ],
    },vendor:[]};
    if(p.manufacturer_norm)payload.product.brand=p.manufacturer_norm;
    const uomVal=uom(p.product_uom);if(uomVal)payload.product.uom=uomVal;
    try{
      const r=await zf(`${url}product`,{method:'POST',headers:zh(key),body:JSON.stringify(payload)});
      const uid=r.j?.data?.product_uid;
      if(uid){bs++;bR.push({name:p.product_name,uid,ok:true});log(`✓ Bundle: ${p.product_name} — ${uid.slice(0,8)}...`);}
      else{bf++;const err=apiErr(r.j);bR.push({name:p.product_name,uid:null,ok:false,error:err});if(bErrLog.length<20)bErrLog.push(`${p.product_name}: ${err}`);log(`✗ ${p.product_name}: ${err}`);}
    }catch(e){
      if(e.message==='CANCELLED')throw e;
      bf++;bR.push({name:p.product_name,uid:null,ok:false,error:e.message});
      if(bErrLog.length<20)bErrLog.push(`${p.product_name}: ${e.message}`);
    }
    await slp(BDLY);
  }

  log(`Bundles: ${bs} created, ${bReused} reused, ${bf} failed`);
  onPhase('bundles',bf===0?'done':'partial',{success:bs,reused:bReused,failed:bf,errors:bErrLog.slice(0,20)});
  return{bR};
}

/* Bracket-matching CEIL stripper — handles nested parens like CEIL((a*(1+b))/100) */
function stripCeil(expr){
  let s=expr,changed=true;
  while(changed){
    changed=false;
    const up=s.toUpperCase();
    let idx=up.indexOf('CEIL(');
    while(idx!==-1){
      const start=idx+4; // position of opening '('
      let depth=0,end=-1;
      for(let i=start;i<s.length;i++){
        if(s[i]==='(')depth++;
        else if(s[i]===')'){depth--;if(depth===0){end=i;break;}}
      }
      if(end!==-1){
        const inner=s.slice(start+1,end); // content between CEIL's parens
        s=s.slice(0,idx)+'('+inner+')'+s.slice(end+1);
        changed=true;break; // restart scan from scratch
      }
      idx=up.indexOf('CEIL(',idx+1);
    }
  }
  // Collapse redundant double parens: ((x)) → (x)
  let prev='';
  while(prev!==s){prev=s;s=s.replace(/\(\(([^()]+)\)\)/g,'($1)');}
  return s;
}

function mkFormula(li,toks,wasteOverride){
  if(li.formula_type==='direct_input'||!li.formula_expr)return null;

  // ── Priority 1: hardcoded industry-standard formula ──────────────────────
  const hf=findHardcodedFormula(li.display_name);
  if(hf){
    const result=buildHardcodedFormula(hf,toks,li.display_name,wasteOverride);
    if(result)return result;
  }

  // ── Priority 2: DB formula_expr — substitute tokens, then strip CEIL ─────
  const sorted=[...toks].sort((a,b)=>b.name.length-a.name.length);
  let mapped=li.formula_expr;
  const em=[];let c=1;
  for(const t of sorted){
    if(!t.name||!mapped.includes(t.name))continue;
    const k=`$${c}`;
    mapped=mapped.split(t.name).join(k);
    em.push({key:k,type:'MEASUREMENT',measurement_token_uid:t.uid,measurement_category_uid:t.catUid});
    c++;
  }
  if(!em.length)return null;
  // Detect whether original expression had CEIL — determines rounding mechanism:
  // CEIL present  → strip it + use NEXT_WHOLE_NUMBER (ceiling behaviour preserved via rounding)
  // No CEIL       → leave expression untouched, use NO_ROUNDING (formula already precise)
  const hadCeil=/CEIL\s*\(/i.test(mapped);
  const expr=hadCeil?stripCeil(mapped.replace(/\s+/g,'')):mapped.replace(/\s+/g,'');
  const rounding=hadCeil?'NEXT_WHOLE_NUMBER':'NO_ROUNDING';
  const ck=li.display_name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').substring(0,50)+'_cpq';
  return{formula:{formula_name:`${li.display_name} (CPQ)`,formula_key:ck,formula_category:'AREA_MEASUREMENT',formula_description:li.display_name,formula:{expression:expr,expression_map:em,rounding_mechanism:rounding}}};
}

async function runImport({auth,selProds,lineItems,mappings,tiers,waste,accSet,pkgNames,signal,onPhase,onLog}){
  const sig=signal||{cancel:false,pause:false};
  const{key,url}=auth,log=m=>onLog&&onLog(m);
  async function chk(){while(sig.pause&&!sig.cancel)await slp(200);if(sig.cancel)throw new Error('CANCELLED');}

  // ── Phase 1: Tokens + ensure product category exists ─────────────────────
  await chk();
  onPhase('tokens','active');log('Fetching measurement tokens and product category...');
  const[toks,rawCat]=await Promise.all([getMeasTokens(key,url),getProdCat(key,url)]);
  const cu=await ensureProdCat(key,url,rawCat);
  log(`${toks.length} tokens · category UID: ${cu||'none (no category set)'}`);
  onPhase('tokens','done',{count:toks.length});

  // ── Phase 2: Material Products (PARTS) ───────────────────────────────────
  await chk();
  onPhase('products','active');
  // Classify all products upfront
  const prodClassMap={};
  selProds.forEach(p=>{prodClassMap[p.product_id]=classifyProd(p);});
  const bundleCandidates=selProds.filter(p=>prodClassMap[p.product_id]==='BUNDLE');
  const partsOnly=selProds.filter(p=>prodClassMap[p.product_id]==='PARTS');
  const skipItems=selProds.filter(p=>prodClassMap[p.product_id]==='SKIP');
  log(`Classified: ${bundleCandidates.length} BUNDLE · ${partsOnly.length} PARTS-only · ${skipItems.length} SKIP (service/delivery items)`);
  if(skipItems.length>0) log(`\u26a0 ${skipItems.length} products SKIPPED (matched service keywords — inspection, delivery, permit etc.)`);
  log(`Creating ${bundleCandidates.length+partsOnly.length} material products (${bundleCandidates.length} with labor sibling, ${partsOnly.length} parts-only)...`);

  const pR=[],um={};let ps=0,pf=0;
  const prodErrLog=[];

  // Pre-fetch existing products to handle re-runs without duplicates
  const existProdByExtId={};
  try{
    let pg=1;
    while(true){
      const r=await zf(`${url}product?count=100&page=${pg}`,{headers:zh(key)});
      const items=r.j?.data||[];
      items.forEach(p=>{if(p.product_id&&p.product_uid)existProdByExtId[p.product_id]=p.product_uid;});
      if(items.length<100)break;pg++;
    }
    if(Object.keys(existProdByExtId).length)log(`Found ${Object.keys(existProdByExtId).length} existing products — will reuse`);
  }catch(e){if(e.message==='CANCELLED')throw e;log('Could not pre-check products: '+e.message);}

  // Build payloads — BUNDLE items get "- Material" suffix + -MAT product_id
  const allMatProds=[...bundleCandidates,...partsOnly];
  const pls=allMatProds.map(p=>mkProd(p,cu,prodClassMap[p.product_id]==='BUNDLE'));

  for(const[ci,chunk]of cks(pls,BULK).entries()){
    await chk();
    const si=ci*BULK;

    // Split chunk: items that already exist vs new ones
    const newIdxs=[],reuseIdxs=[];
    for(let i=0;i<chunk.length;i++){
      if(existProdByExtId[chunk[i].product.product_id])reuseIdxs.push(i);
      else newIdxs.push(i);
    }
    // Record reused products
    reuseIdxs.forEach(i=>{
      const p=allMatProds[si+i],uid=existProdByExtId[chunk[i].product.product_id];
      um[p.product_id]=uid;ps++;
      pR.push({name:p.product_name,uid,ok:true,reused:true});
    });

    if(newIdxs.length===0){await slp(BDLY);continue;}
    const newChunk=newIdxs.map(i=>chunk[i]);

    // Try bulk create for new items
    let bulkOk=false;
    try{
      const r=await zf(`${url}products/bulk`,{method:'POST',headers:zh(key),body:JSON.stringify({products:newChunk})});
      if(r.ok&&Array.isArray(r.j?.data)&&r.j.data.length){
        for(let i=0;i<newIdxs.length;i++){
          const p=allMatProds[si+newIdxs[i]];
          const uid=r.j.data[i]?.product_uid;
          if(uid){um[p.product_id]=uid;ps++;}
          else{pf++;if(prodErrLog.length<20)prodErrLog.push(`${p.product_name}: ${apiErr(r.j.data[i])||'no UID'}`);}
          pR.push({name:p.product_name,uid:uid||null,ok:!!uid});
        }
        bulkOk=true;
      }else if(!r.ok){
        if(prodErrLog.length<3)prodErrLog.push(`Bulk HTTP ${r.status}: ${apiErr(r.j)}`);
      }
    }catch(e){if(e.message==='CANCELLED')throw e;log('\u26a0 Bulk unavailable ('+e.message.slice(0,40)+') — using individual creates');}

    // FIXED fallback — windowed from 0, no double-execution
    if(!bulkOk){
      for(let w=0;w<newIdxs.length;w+=FALLBACK_CONC){
        await Promise.all(newIdxs.slice(w,w+FALLBACK_CONC).map(async(ci2)=>{
          if(sig.cancel)return;
          const p=allMatProds[si+ci2];
          try{
            const r=await zf(`${url}product`,{method:'POST',headers:zh(key),body:JSON.stringify(chunk[ci2])});
            const uid=r.j?.data?.product_uid;
            if(uid){um[p.product_id]=uid;ps++;}
            else{pf++;if(prodErrLog.length<20)prodErrLog.push(`${p.product_name}: ${apiErr(r.j)}`);}
            pR.push({name:p.product_name,uid:uid||null,ok:!!uid});
          }catch(e){
            if(e.message==='CANCELLED')throw e;
            pf++;pR.push({name:p.product_name,uid:null,ok:false});
            if(prodErrLog.length<20)prodErrLog.push(`${p.product_name}: ${e.message}`);
          }
        }));
      }
    }
    await slp(BDLY);
  }
  log(`Material Products: ${ps} created/reused, ${pf} failed`);
  if(pf>0){log(`--- Material product errors (${Math.min(prodErrLog.length,10)} shown):`);prodErrLog.slice(0,10).forEach(e=>log('  \u2717 '+e));}
  onPhase('products',pf===0?'done':'partial',{success:ps,failed:pf,errors:prodErrLog.slice(0,20)});

  // ── Phase 2b: Labor Products (SERVICE, $0) ────────────────────────────────
  await chk();
  onPhase('labor','active');
  const ulm={};
  const lR=[];let ls=0,lf=0,lReused=0;
  const laborErrLog=[];
  const laborPayloads=bundleCandidates.map(p=>mkProdLabor(p,cu));
  log(`Creating ${laborPayloads.length} labor products (SERVICE, $0)...`);

  for(const[ci,chunk]of cks(laborPayloads,BULK).entries()){
    await chk();
    const si=ci*BULK;
    const newIdxsL=[],reuseIdxsL=[];
    for(let i=0;i<chunk.length;i++){
      if(existProdByExtId[chunk[i].product.product_id])reuseIdxsL.push(i);
      else newIdxsL.push(i);
    }
    reuseIdxsL.forEach(i=>{
      const p=bundleCandidates[si+i],uid=existProdByExtId[chunk[i].product.product_id];
      ulm[p.product_id]=uid;ls++;lReused++;
      lR.push({name:`${p.product_name} - Labor`,uid,ok:true,reused:true});
    });
    if(newIdxsL.length===0){await slp(BDLY);continue;}
    const newChunkL=newIdxsL.map(i=>chunk[i]);
    let bulkOkL=false;
    try{
      const r=await zf(`${url}products/bulk`,{method:'POST',headers:zh(key),body:JSON.stringify({products:newChunkL})});
      if(r.ok&&Array.isArray(r.j?.data)&&r.j.data.length){
        for(let i=0;i<newIdxsL.length;i++){
          const p=bundleCandidates[si+newIdxsL[i]];
          const uid=r.j.data[i]?.product_uid;
          if(uid){ulm[p.product_id]=uid;ls++;}
          else{lf++;if(laborErrLog.length<10)laborErrLog.push(`${p.product_name} - Labor: ${apiErr(r.j.data[i])||'no UID'}`);}
          lR.push({name:`${p.product_name} - Labor`,uid:uid||null,ok:!!uid});
        }
        bulkOkL=true;
      }else if(!r.ok){if(laborErrLog.length<3)laborErrLog.push(`Bulk HTTP ${r.status}: ${apiErr(r.j)}`);}
    }catch(e){if(e.message==='CANCELLED')throw e;log('\u26a0 Labor bulk unavailable — using individual creates');}
    if(!bulkOkL){
      for(let w=0;w<newIdxsL.length;w+=FALLBACK_CONC){
        await Promise.all(newIdxsL.slice(w,w+FALLBACK_CONC).map(async(ci2)=>{
          if(sig.cancel)return;
          const p=bundleCandidates[si+ci2];
          try{
            const r=await zf(`${url}product`,{method:'POST',headers:zh(key),body:JSON.stringify(chunk[ci2])});
            const uid=r.j?.data?.product_uid;
            if(uid){ulm[p.product_id]=uid;ls++;}
            else{lf++;if(laborErrLog.length<10)laborErrLog.push(`${p.product_name} - Labor: ${apiErr(r.j)}`);}
            lR.push({name:`${p.product_name} - Labor`,uid:uid||null,ok:!!uid});
          }catch(e){
            if(e.message==='CANCELLED')throw e;
            lf++;lR.push({name:`${p.product_name} - Labor`,uid:null,ok:false});
            if(laborErrLog.length<10)laborErrLog.push(`${p.product_name} - Labor: ${e.message}`);
          }
        }));
      }
    }
    await slp(BDLY);
  }
  log(`Labor Products: ${ls} created/reused (${lReused} reused), ${lf} failed`);
  if(lf>0){laborErrLog.slice(0,5).forEach(e=>log('  \u2717 '+e));}
  onPhase('labor',lf===0?'done':'partial',{success:ls,reused:lReused,failed:lf,errors:laborErrLog.slice(0,20)});

  // ── Phase 3: Bundles (BUNDLE = Material + Labor) — must run BEFORE packages ──
  await chk();
  onPhase('bundles','active');
  const bR=[],ubm={};
  let bs=0,bf=0,bReused=0;
  const bErrLog=[];

  const bundleCreates=bundleCandidates.filter(p=>um[p.product_id]&&ulm[p.product_id]&&
    !/optional|addon|add-on/i.test(p.product_name||''));
  log(`Bundles: ${bundleCreates.length} candidates — creating with ${FALLBACK_CONC} concurrent workers`);

  // Ensure category exists before spawning workers (category creation must be serial)
  if(!cu&&bundleCreates.length>0){
    try{
      const catR=await zf(`${url}products/category`,{method:'POST',headers:zh(key),body:JSON.stringify({product_category:{category_name:'CPQ Imports',business_unit:[]}})});
      const newCu=catR.j?.data?.product_category_uid;
      if(newCu){cu=newCu;log(`Created "CPQ Imports" category → ${newCu.slice(0,8)}...`);}
    }catch(e){if(e.message==='CANCELLED')throw e;log('Could not create bundle category: '+e.message);}
  }

  // Separate reused from new upfront — reused need no API call
  const toCreate=[];
  bundleCreates.forEach(p=>{
    const extId=`SRS-${p.product_id}-BND`;
    if(existProdByExtId[extId]){
      ubm[p.product_id]=existProdByExtId[extId];bReused++;
      bR.push({name:p.product_name,uid:existProdByExtId[extId],ok:true,reused:true});
    }else{toCreate.push(p);}
  });
  if(bReused)log(`↺ ${bReused} bundles reused from previous run`);

  // Windowed concurrent creation — same FALLBACK_CONC=8 pattern as products
  for(let w=0;w<toCreate.length;w+=FALLBACK_CONC){
    await chk();
    await Promise.all(toCreate.slice(w,w+FALLBACK_CONC).map(async p=>{
      if(sig.cancel)return;
      const extId=`SRS-${p.product_id}-BND`;
      const matPrice=Math.round((parseFloat(p.suggested_price)||0)*100)/100;
      const payload={product:{
        product_name:p.product_name,
        product_id:extId,
        is_available:true,
        price:matPrice,
        min_quantity:0,quantity:0,
        product_type:'BUNDLE',pricing_level:'ROLLUP',
        track_quantity:false,has_custom_tax:false,meta_data:[],
        is_billable:true,consider_profitability:true,is_commissionable:true,
        location_availability:[],
        tax:{tax_exempt:false},product_files:[],
        option:{customer_selection:false,option_label:'Option',option_values:[]},
        associated_products:[
          {product_uid:um[p.product_id], quantity:1,price:matPrice,purchase_price:0,preferred_product:false},
          {product_uid:ulm[p.product_id],quantity:1,price:0,        purchase_price:0,preferred_product:false},
        ],
      },vendor:[]};
      if(p.manufacturer_norm)payload.product.brand=p.manufacturer_norm;
      const uomVal=uom(p.product_uom);if(uomVal)payload.product.uom=uomVal;
      if(cu)payload.product.product_category=cu;
      try{
        const r=await zf(`${url}product`,{method:'POST',headers:zh(key),body:JSON.stringify(payload)});
        const uid=r.j?.data?.product_uid;
        if(uid){ubm[p.product_id]=uid;bs++;bR.push({name:p.product_name,uid,ok:true});log(`\u2713 Bundle: ${p.product_name} — ${uid.slice(0,8)}...`);}
        else{bf++;const err=apiErr(r.j);bR.push({name:p.product_name,uid:null,ok:false,error:err});if(bErrLog.length<20)bErrLog.push(`${p.product_name}: ${err}`);log(`\u2717 ${p.product_name}: ${err}`);}
      }catch(e){
        if(e.message==='CANCELLED')throw e;
        bf++;bR.push({name:p.product_name,uid:null,ok:false,error:e.message});
        if(bErrLog.length<20)bErrLog.push(`${p.product_name}: ${e.message}`);
      }
    }));
    await slp(BDLY);
  }
  log(`Bundles: ${bs} created, ${bReused} reused, ${bf} failed`);
  onPhase('bundles',bf===0?'done':'partial',{success:bs,reused:bReused,failed:bf,errors:bErrLog.slice(0,20)});

  // ── Phase 4: Formulas ─────────────────────────────────────────────────────
  await chk();
  onPhase('formulas','active');
  const fR=[],fu={};let fs=0,fReused=0,fsk=0,ff=0;
  const fErrLog=[];

  const existingByKey={},existingByName={};
  try{
    let pg=1;
    while(true){
      await chk();
      const r=await zf(`${url}invoice_estimate/cpq/formulas?count=100&page=${pg}`,{headers:zh(key)});
      const items=r.j?.data||[];
      items.forEach(f=>{
        if(f.formula_key&&f.formula_uid)existingByKey[f.formula_key]=f.formula_uid;
        if(f.formula_name&&f.formula_uid)existingByName[f.formula_name]=f.formula_uid;
      });
      if(items.length<100)break;pg++;
    }
    log(`Existing formulas: ${Object.keys(existingByKey).length} — skipping duplicates`);
  }catch(e){if(e.message==='CANCELLED')throw e;log('Could not check existing formulas: '+e.message);}

  const fps=[];
  for(const liId of[...new Set(Object.values(mappings).filter(Boolean))]){
    const li=lineItems.find(l=>l.id===liId);if(!li)continue;
    const fp=mkFormula(li,toks,waste);
    if(!fp){fsk++;continue;}
    const existUid=existingByKey[fp.formula.formula_key]||existingByName[fp.formula.formula_name];
    if(existUid){fu[li.id]=existUid;fReused++;fR.push({name:li.display_name,uid:existUid,ok:true,reused:true});}
    else fps.push({li,fp});
  }
  const ceilCount=fps.filter(x=>x.fp.formula.formula.rounding_mechanism==='NEXT_WHOLE_NUMBER').length;
  const noRoundCount=fps.filter(x=>x.fp.formula.formula.rounding_mechanism==='NO_ROUNDING').length;
  log(`Formulas: ${fps.length} new, ${fReused} reused, ${fsk} skipped — rounding: ${ceilCount} NEXT_WHOLE_NUMBER (had CEIL), ${noRoundCount} NO_ROUNDING`);

  for(const[,chunk]of cks(fps,BULK).entries()){
    await chk();let ok=false;
    try{
      const r=await zf(`${url}invoice_estimate/cpq/formulas/bulk`,{method:'POST',headers:zh(key),body:JSON.stringify({formulas:chunk.map(x=>x.fp)})});
      if(r.ok&&Array.isArray(r.j?.data)&&r.j.data.length){
        for(let i=0;i<chunk.length;i++){
          const{li}=chunk[i],uid=r.j.data[i]?.formula_uid;
          if(uid){fu[li.id]=uid;fs++;}
          else{ff++;if(fErrLog.length<10)fErrLog.push(`${li.display_name}: ${apiErr(r.j.data[i])||'no UID'}`);}
          fR.push({name:li.display_name,uid:uid||null,ok:!!uid});
        }
        ok=true;
      }else if(!r.ok){log('\u26a0 Formula bulk returned '+r.status+' — using individual creates');}
    }catch(e){if(e.message==='CANCELLED')throw e;log('\u26a0 Formula bulk unavailable — using individual creates');}
    if(!ok){
      for(let w=0;w<chunk.length;w+=FALLBACK_CONC){
        await Promise.all(chunk.slice(w,w+FALLBACK_CONC).map(async({li,fp})=>{
          if(sig.cancel)return;
          try{
            const r=await zf(`${url}invoice_estimate/cpq/formulas`,{method:'POST',headers:zh(key),body:JSON.stringify(fp)});
            const uid=r.j?.data?.formula_uid;
            if(uid){fu[li.id]=uid;fs++;}
            else{ff++;if(fErrLog.length<10)fErrLog.push(`${li.display_name}: ${apiErr(r.j)}`);}
            fR.push({name:li.display_name,uid:uid||null,ok:!!uid});
          }catch(e){if(e.message==='CANCELLED')throw e;ff++;fR.push({name:li.display_name,uid:null,ok:false});fErrLog.push(li.display_name+': '+e.message);}
        }));
      }
    }
    await slp(BDLY);
  }
  log(`Formulas: ${fs} created, ${fReused} reused, ${fsk} skipped, ${ff} failed`);
  if(ff>0){log('--- Formula errors:');fErrLog.slice(0,8).forEach(e=>log('  \u2717 '+e));}
  onPhase('formulas','done',{success:fs,reused:fReused,skipped:fsk,failed:ff,errors:fErrLog.slice(0,20)});

  // ── Phase 5: Packages — bundle UIDs used where available ─────────────────
  await chk();
  onPhase('packages','active');
  const pkgR=[];
  const availUids=Object.keys(um).length;
  log(`Building packages — ${Object.keys(ubm).length} bundles, ${availUids} material products`);

  const pkgDefs=['good','better','best'].map(tk=>{
    const tp=tiers[tk]||[],un=tiers.untiered||[];
    const all=tk==='best'?[...tp,...un]:tp;
    let matched=all.filter(p=>ubm[p.product_id]||um[p.product_id]);
    if(matched.length===0){
      const allImp=selProds.filter(p=>ubm[p.product_id]||um[p.product_id]);
      const take=tk==='good'?Math.ceil(allImp.length*0.4):tk==='better'?Math.ceil(allImp.length*0.7):allImp.length;
      matched=allImp.slice(0,take);
    }
    const line_items=matched.map(p=>{
      const isBundled=!!ubm[p.product_id];
      const prodUid=isBundled?ubm[p.product_id]:um[p.product_id];
      const hasFormula=!!(mappings[p.product_id]&&fu[mappings[p.product_id]]);
      const unitPrice=hasFormula?(parseFloat(p.suggested_price)||0):0;
      const li={
        line_item_type:'ITEM',
        product_uid:prodUid,
        product_id:isBundled?`SRS-${p.product_id}-BND`:`SRS-${p.product_id}`,
        product_type:isBundled?'BUNDLE':'PARTS',
        name:p.product_name,description:'',uom:uom(p.product_uom),
        quantity:hasFormula?1:0,
        unit_price:unitPrice,purchase_price:0,
        discount:0,discount_type:'FIXED',serial_nos:[],total:unitPrice,
        section_type:'EXPANDED',show_section_total:false,show_child_prices:true,
        brand:p.manufacturer_norm||'',specification:'',image:'',
        location_uid:'',location_name:'',
        tax:{tax_exempt:false},is_billable:true,associated_products:[],
      };
      if(hasFormula)li.formula=fu[mappings[p.product_id]];
      return li;
    });
    const tmpl=(pkgNames&&pkgNames[tk])||`${TM[tk].label} - ${TM[tk].sub}`;const package_name=tmpl.replace(/\{brand\}/gi,(selProds.find(p=>p.manufacturer_norm)?.manufacturer_norm||'')).replace(/\s{2,}/g,' ').trim()||tmpl;return{package_name,line_items,tier:tk};
  });

  for(const{package_name,line_items,tier}of pkgDefs){
    await chk();
    if(line_items.length===0){
      log(`\u26a0 Skipping "${package_name}" — no products available`);
      pkgR.push({name:package_name,uid:null,ok:false,tier,error:'No products with UIDs'});
      continue;
    }
    const bundledCount=line_items.filter(li=>li.product_type==='BUNDLE').length;
    log(`Creating "${package_name}" — ${line_items.length} items (${bundledCount} bundles, ${line_items.length-bundledCount} parts)...`);
    try{
      const r=await zf(`${url}invoice_estimate/package`,{
        method:'POST',headers:zh(key),
        body:JSON.stringify({invoice_estimate_package:{package_name,line_items}}),
      });
      const uid=r.j?.data?.package_uid;
      if(uid){pkgR.push({name:package_name,uid,ok:true,tier});log(`\u2713 "${package_name}" — ${uid.slice(0,8)}...`);}
      else{const err=apiErr(r.j);pkgR.push({name:package_name,uid:null,ok:false,tier,error:err});log(`\u2717 "${package_name}": ${err}`);}
    }catch(e){
      if(e.message==='CANCELLED')throw e;
      pkgR.push({name:package_name,uid:null,ok:false,tier,error:e.message});
      log(`\u2717 "${package_name}": ${e.message}`);
    }
    await slp(300);
  }
  const ps2=pkgR.filter(r=>r.ok).length,pf2=pkgR.filter(r=>!r.ok).length;
  log(`Packages: ${ps2} created, ${pf2} failed`);
  onPhase('packages',pf2===0?'done':'partial',{success:ps2,failed:pf2});
  return{pR,lR,bR,fR,pkgR,um,ulm,ubm,bundleCandidates,prodClassMap};
}

/* ── Deletion engine — fetches UIDs from Zuper then deletes one-by-one with pause/cancel ── */
async function fetchDeleteUids(type,url,key){
  if(type==='products'){
    const all=[];let pg=1;
    while(true){const r=await zf(`${url}product?count=50&page=${pg}`,{headers:zh(key)});const d=r.j?.data||[];all.push(...d.map(p=>({uid:p.product_uid,name:p.product_name||''})));if(d.length<50)break;pg++;}
    return all;
  }
  if(type==='formulas'){
    let pg=1,all=[];
    while(true){const r=await zf(`${url}invoice_estimate/cpq/formulas?count=100&page=${pg}`,{headers:zh(key)});const d=r.j?.data||[];const custom=d.filter(f=>f.is_custom===true);all.push(...custom.map(f=>({uid:f.formula_uid,name:f.formula_name||''})));if(d.length<100)break;pg++;}
    return all;
  }
  if(type==='packages'){
    const all=[];let pg=1;
    while(true){const r=await zf(`${url}invoice_estimate/package?count=50&page=${pg}`,{headers:zh(key)});const d=r.j?.data||[];all.push(...d.map(p=>({uid:p.package_uid,name:p.package_name||''})));if(d.length<50)break;pg++;}
    return all;
  }
  return[];
}
function deleteEndpoint(type,url,uid){
  if(type==='products')return`${url}product/${uid}`;
  if(type==='formulas')return`${url}invoice_estimate/cpq/formulas/${uid}`;
  if(type==='packages')return`${url}invoice_estimate/package/${uid}`;
  return null;
}

/* ─── UI ─────────────────────────────────────────────────────────────── */
/* ── UOM-aware product cost estimator ──────────────────────────────────────
 * Estimates installed cost from actual suggested_price × UOM-based quantity.
 */
function estProdCost(p,sqft,pitchMult,storyMult){
  const price=parseFloat(p.suggested_price)||0;
  if(!price)return 0;
  const rawUom=(uom(p.product_uom)||'').toLowerCase().trim();
  const sq=sqft/100,perim=Math.pow(sqft,0.5)*4.2;
  let qty;
  switch(rawUom){
    case'sq':case'square':case'squares':qty=sq*pitchMult*storyMult;break;
    case'lf':case'linear foot':case'linear feet':case'lin ft':qty=perim*pitchMult;break;
    case'roll':case'rolls':qty=Math.ceil(sq*1.15);break;
    case'bundle':case'bundles':case'bdl':case'bdls':qty=Math.ceil(sq*3*pitchMult);break;
    case'pc':case'pcs':case'piece':case'pieces':qty=Math.ceil(perim/10);break;
    case'ea':case'each':qty=storyMult;break;
    default:qty=sq*pitchMult;
  }
  return price*qty;
}

function downloadMappingCsv(selP,mappings,lineItems,fmap){

/*
 * ─── STEP 2: Products — Filter Engine ───────────────────────────────────────
 *
 * HOW FILTERING WORKS:
 *
 * 1. Brand (pill or dropdown) — case-insensitive exact match on manufacturer_norm.
 *    Pills are matched to canonical DB values via normalised startsWith so "GAF"
 *    matches both "GAF" and "GAF Roofing Products" in the DB.
 *
 * 2. Category (dropdown) — case-insensitive exact match on product_category.
 *    The category list narrows automatically when a brand is selected.
 *
 * 3. Tier (dropdown) — normT() on family_tier from srs_product_families or
 *    the product row itself.
 *
 * 4. Free-text search — space-split into tokens. Every token must appear in
 *    at least ONE of these fields (OR per field, AND across tokens):
 *      product_name · manufacturer_norm · product_category · product_line
 *      · proposal_line_item
 *
 *    IMPORTANT: when a brand is already selected via dropdown/pill, the text
 *    search does NOT re-filter on manufacturer_norm. This prevents the common
 *    failure mode where selecting "GAF" then typing "gaf shingles" yields 0
 *    results because the brand field was double-filtered.
 *
 * 5. Debounce: 250 ms on the text field — prevents re-filtering 19k rows on
 *    every keystroke.
 */
function Step2({onNext,selIds,setSelIds,allProds,fmap,prodsLoaded,loadProgress,accIds,setAccIds}){

  const[brand,setBrand]=useState('');   // canonical manufacturer_norm from DB
  const[catF,setCatF]=useState('');
  const[tierF,setTierF]=useState('');
  const[pg,setPg]=useState(0);
  const q=useDb(rawQ,250);
  const selSet=useMemo(()=>new Set(selIds),[selIds]);

    Array.from(new Set(allProds.map(p=>p.manufacturer_norm).filter(Boolean))).sort(),
  [allProds]);

  // Quick-pill brands that exist in DB (case-insensitive prefix match)
  const visPills=useMemo(()=>
    Q_BRANDS.filter(qb=>allBrands.some(b=>n(b)===n(qb)||n(b).startsWith(n(qb)+' '))),
  [allBrands]);

  // Map pill label → canonical DB value
  const canonical=useCallback((qb)=>
    allBrands.find(b=>n(b)===n(qb)||n(b).startsWith(n(qb)+' '))||qb,
  [allBrands]);

  // Category list: narrows when brand selected
  const availCats=useMemo(()=>{
    const base=brand?allProds.filter(p=>n(p.manufacturer_norm)===n(brand)):allProds;
    return Array.from(new Set(base.map(p=>p.product_category).filter(Boolean))).sort();
  },[allProds,brand]);
  useEffect(()=>{if(catF&&!availCats.includes(catF))setCatF('');},[brand,availCats]);

  // ── THE FILTER ──────────────────────────────────────────────────────────────

              // Accessory toggle — stops row click from propagating
              isSel&&setAccIds&&React.createElement('button',{
                className:'btn-ico btn-sm',
                style:{fontSize:10,padding:'2px 6px',marginLeft:4,flexShrink:0,
                  background:isAcc?'rgba(245,158,11,.15)':'transparent',
                  color:isAcc?'var(--am)':'var(--txd)',
                  border:`1px solid ${isAcc?'rgba(245,158,11,.4)':'var(--bdd)'}`,
                  borderRadius:3,cursor:'pointer'},
                onClick:e=>{
                  e.stopPropagation();
                  setAccIds(prev=>{const n=new Set(prev);n.has(p.product_id)?n.delete(p.product_id):n.add(p.product_id);return n;});
                },
                title:isAcc?'Mark as regular product (include in packages)':'Mark as Accessory (catalog only, excluded from packages)',
              },isAcc?'🔧 Acc':'+ Acc')
            );
          })
    ),
    // Pagination
    totPg>1&&React.createElement('div',{className:'pg'},
      React.createElement('button',{className:'btn-g btn-sm',disabled:pg===0,onClick:()=>setPg(0)},'«'),
      React.createElement('button',{className:'btn-g btn-sm',disabled:pg===0,onClick:()=>setPg(p=>p-1)},'‹'),
      React.createElement('span',{className:'pg-n'},`${pg+1} / ${totPg}`),
      React.createElement('button',{className:'btn-g btn-sm',disabled:pg>=totPg-1,onClick:()=>setPg(p=>p+1)},'›'),
      React.createElement('button',{className:'btn-g btn-sm',disabled:pg>=totPg-1,onClick:()=>setPg(totPg-1)},'»'),
      React.createElement('span',{style:{fontSize:11,color:'var(--txd)',marginLeft:8}},filtered.length.toLocaleString()+' total')
    ),
    React.createElement('div',{className:'nav'},
      React.createElement('span',{className:'nav-i'},
        selIds.length?selIds.length.toLocaleString()+' selected'+(accIds&&accIds.size?' · '+accIds.size+' accessories':''):'Select at least 1 product'
      ),
      React.createElement('button',{className:'btn',disabled:!selIds.length,onClick:onNext},'Next: Map Line Items →')
    )
  );
}

function Step3({selIds,allProds,fmap,lineItems,setLineItems,mappings,setMappings,waste,setWaste,accIds,setAccIds,onNext,onBack}){
  const[ld,sld]=useState(!lineItems.length);const[err,se]=useState('');
  const[mapFilter,setMapFilter]=useState(null);
  const[validating,sValidating]=useState(false);
  const[validation,sValidation]=useState(null);
  const[showValidate,sShowValidate]=useState(false);

  // Stable string key for current selection — changes whenever the product set changes
  const selKey=useMemo(()=>selIds.slice().sort().join(','),[selIds]);
  // Track which selKey we last mapped against — prevents redundant re-mapping
  const lastMappedKey=useRef(null);

  // Effect 1: load line items once (only fires when lineItems is empty)
  useEffect(()=>{
    if(lineItems.length)return;
    sld(true);
    (async()=>{
      const{data,error}=await loadLIs();
      if(error){se(error.message);sld(false);return;}
      setLineItems(data);
      sld(false);
      // Mapping will trigger via Effect 2 when lineItems.length changes
    })();
  },[]);

  // Effect 2: re-map whenever selIds changes OR when lineItems first loads
  // This is what was missing — it re-runs every time the user changes product selection
  useEffect(()=>{
    if(!lineItems.length||!selIds.length)return;
    if(lastMappedKey.current===selKey)return; // selection unchanged — skip
    lastMappedKey.current=selKey;
    const selProds=allProds.filter(p=>selIds.includes(p.product_id));
    setMappings(buildAutoMappings(selProds,lineItems));
    // Clear validation when selection changes
    sValidation(null);sShowValidate(false);
  },[selKey,lineItems.length]);

  const selP=useMemo(()=>allProds.filter(p=>selIds.includes(p.product_id)),[allProds,selIds]);

  // ── Summary stats ────────────────────────────────────────────────────────
  const summary=useMemo(()=>{
    let mapped=0,withFormula=0,hardcodedF=0,dbF=0,directInput=0,notMapped=0;
    const formulaExprs={};
    for(const p of selP){
      const liId=mappings[p.product_id];
      if(!liId){notMapped++;continue;}
      mapped++;
      const li=lineItems.find(l=>l.id===liId);
      if(li?.formula_expr&&li.formula_type!=='direct_input'){
        withFormula++;
        if(findHardcodedFormula(li.display_name))hardcodedF++;else dbF++;
        formulaExprs[li.formula_expr]=(formulaExprs[li.formula_expr]||0)+1;
      }else{directInput++;}
    }
    const uniqueFormulas=Object.entries(formulaExprs).sort((a,b)=>b[1]-a[1]);
    return{mapped,withFormula,hardcodedF,dbF,directInput,notMapped,uniqueFormulas,formulasToCreate:uniqueFormulas.length};
  },[selP,mappings,lineItems]);

  // ── Filtered product list driven by mapFilter ────────────────────────────
  const filteredProds=useMemo(()=>{
    if(!mapFilter)return selP;
    return selP.filter(p=>{
      const liId=mappings[p.product_id];
      const li=liId?lineItems.find(l=>l.id===liId):null;
      const hasF=!!(li?.formula_expr&&li.formula_type!=='direct_input');
      if(mapFilter==='mapped')return!!liId;
      if(mapFilter==='formula')return hasF;
      if(mapFilter==='direct')return liId&&!hasF;
      if(mapFilter==='unmapped')return!liId;
      return true;
    });
  },[selP,mappings,lineItems,mapFilter]);

  const reAutoMap=()=>{setMappings(buildAutoMappings(selP,lineItems));sValidation(null);sShowValidate(false);};

  // Removes mappings for products whose line item has no formula (direct_input / no formula_expr)
  // Those products still go into packages but with $0 price so the package structure is preserved
  const clearNonFormulaMappings=()=>{
    setMappings(m=>{
      const nm={...m};
      for(const[pid,liId]of Object.entries(nm)){
        if(!liId)continue;
        const li=lineItems.find(l=>l.id===liId);
        const hasF=!!(li?.formula_expr&&li.formula_type!=='direct_input');
        if(!hasF)delete nm[pid];
      }
      return nm;
    });
  };

  // ── Validate: compare auto-suggested mapping to current ──────────────────
  const runValidate=async()=>{
    sValidating(true);sShowValidate(true);
    const suggested=buildAutoMappings(selP,lineItems);
    const results=selP.map(p=>{
      const curId=mappings[p.product_id];
      const sugId=suggested[p.product_id];
      const curLI=curId?lineItems.find(l=>l.id===curId):null;
      const sugLI=sugId?lineItems.find(l=>l.id===sugId):null;
      const hasF=!!(curLI?.formula_expr&&curLI.formula_type!=='direct_input');
      // Determine formula source for this line item
      const hf=curLI?findHardcodedFormula(curLI.display_name):null;
      const formulaSrc=!hasF?'none':hf?'hardcoded':'db';
      let status='ok';
      if(!curId&&!sugId)status='unmapped';
      else if(!curId&&sugId)status='suggestion';
      else if(curId&&!sugId)status='ok';
      else if(curId!==sugId)status='diff';
      return{pid:p.product_id,name:p.product_name,curLI:curLI?.display_name,sugLI:sugLI?.display_name,hasFormula:hasF,formulaExpr:curLI?.formula_expr,formulaSrc,hfLabel:hf?.label,hfNote:hf?.note,status};
    });
    sValidation(results);sValidating(false);
  };

  const applyAllSuggestions=()=>{
    const suggested=buildAutoMappings(selP,lineItems);
    setMappings(m=>{const nm={...m};for(const[k,v]of Object.entries(suggested))nm[k]=v;return nm;});
    sShowValidate(false);sValidation(null);
  };

  const SUMMARY_CARDS=[
    {key:'mapped',   label:'Mapped to line item',     color:'var(--gr)',  val:summary.mapped,      hint:'Click to show only mapped'},
    {key:'formula',  label:'Formula-linked',           color:'var(--bl)',  val:summary.withFormula,  hint:'Click to show formula-linked'},
    {key:'direct',   label:'Direct input (no formula)',color:'var(--txd)', val:summary.directInput,  hint:'Click to show direct-input'},
    {key:'unmapped', label:'Not matched',              color:'var(--am)',  val:summary.notMapped,    hint:'Click to show unmatched'},
  ];

  if(ld)return React.createElement(Loader,{msg:'Loading proposal_line_items & auto-mapping…'});
  if(err&&!lineItems.length)return React.createElement('div',{className:'a-err'},err);

  return React.createElement('div',null,
    // ── Summary panel with clickable cards ──────────────────────────────
    React.createElement('div',{className:'map-summary'},
      React.createElement('div',{className:'map-summary-title'},
        React.createElement('span',null,'Mapping Summary — click a card to filter'),
        React.createElement('div',{className:'row',style:{gap:6}},
          React.createElement('button',{
            className:'btn-ico btn-sm',
            onClick:()=>downloadMappingCsv(selP,mappings,lineItems,fmap),
            title:'Download full mapping as CSV',
          },'↓ CSV'),
          React.createElement('button',{className:'btn-ico btn-sm',onClick:reAutoMap,title:'Re-run auto-mapping'},'↺ Re-map'),
          React.createElement('button',{
            className:'btn-ico btn-sm',
            onClick:clearNonFormulaMappings,
            title:'Remove all line-item mappings that have no formula — those products will still appear in packages at $0 price',
            style:{borderColor:'rgba(245,158,11,.4)',color:'var(--am)'},
          },'⊘ Clear non-formula'),
          React.createElement('button',{
            className:'btn-ico btn-sm',
            onClick:runValidate,
            disabled:validating,
            style:{borderColor:showValidate?'var(--or)':'',color:showValidate?'var(--or)':''},
            title:'Validate current mappings against auto-mapping suggestions',
          },validating?'…':'✓ Validate')
        )
      ),
      // Clickable stat cards
      React.createElement('div',{className:'map-summary-grid'},
        SUMMARY_CARDS.map(sc=>React.createElement('div',{
          key:sc.key,
          className:`ms-cell${mapFilter===sc.key?' stat-on':''}`,
          style:{cursor:'pointer',transition:'border .15s,background .15s'},
          onClick:()=>setMapFilter(prev=>prev===sc.key?null:sc.key),
          title:sc.hint,
        },
          React.createElement('div',{className:'ms-n',style:{color:mapFilter===sc.key?'var(--or)':sc.val===0?'var(--txdd)':sc.color}},sc.val),
          React.createElement('div',{className:'ms-l'},sc.label),
          React.createElement('div',{className:'stat-hint'},mapFilter===sc.key?'● Active filter':sc.hint)
        ))
      ),
      // Formula source breakdown bar
      summary.withFormula>0&&React.createElement('div',{style:{marginTop:10,padding:'8px 10px',background:'var(--bg2)',borderRadius:'var(--r6)',border:'1px solid var(--bdd)'}},
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:6}},
          React.createElement('div',{style:{fontSize:10,color:'var(--txd)',textTransform:'uppercase',letterSpacing:'.07em',flex:1}},'Formula source breakdown'),
          React.createElement('span',{className:'fbadge fbadge-hc'},'✓ '+summary.hardcodedF+' industry standard'),
          React.createElement('span',{className:'fbadge fbadge-db'},'~ '+summary.dbF+' from DB'),
        ),
        // Progress bar
        React.createElement('div',{style:{height:5,borderRadius:3,background:'var(--bdd)',overflow:'hidden',display:'flex'}},
          summary.hardcodedF>0&&React.createElement('div',{style:{width:`${(summary.hardcodedF/summary.withFormula*100).toFixed(1)}%`,background:'var(--gr)',transition:'width .3s'}}),
          summary.dbF>0&&React.createElement('div',{style:{width:`${(summary.dbF/summary.withFormula*100).toFixed(1)}%`,background:'var(--bl)',transition:'width .3s'}})
        ),
        React.createElement('div',{style:{fontSize:10,color:'var(--txd)',marginTop:4}},
          summary.hardcodedF===summary.withFormula
            ?'✓ All formulas use industry-standard expressions — guaranteed to import successfully'
            :`${summary.dbF} formula(s) will fall back to DB expressions — may fail if token names differ`
        )
      ),
      // Unique formula expressions (DB fallback ones worth knowing about)
      summary.dbF>0&&summary.uniqueFormulas.length>0&&React.createElement('div',{style:{marginTop:6}},
        React.createElement('div',{style:{fontSize:10,color:'var(--txd)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:4}},
          'DB formula expressions ('+summary.dbF+' — may need token-name review):'
        ),
        React.createElement('div',{className:'formula-chips'},
          summary.uniqueFormulas.map(([expr,cnt],i)=>
            React.createElement('div',{key:i,className:'formula-chip-item'},
              React.createElement('span',null,expr.length>52?expr.slice(0,50)+'…':expr),
              React.createElement('span',{className:'fci-count'},cnt+'×')
            )
          )
        )
      ),
      // Active filter indicator
      mapFilter&&React.createElement('div',{style:{fontSize:11,color:'var(--or)',marginTop:8,display:'flex',alignItems:'center',gap:6}},
        React.createElement('span',null,'Showing '+filteredProds.length+' of '+selP.length+' products'),
        React.createElement('button',{className:'f-clr',style:{color:'var(--or)'},onClick:()=>setMapFilter(null)},'× Clear filter')
      )
    ),

    // ── Validation panel ────────────────────────────────────────────────
    showValidate&&validation&&React.createElement('div',{className:'validate-panel'},
      React.createElement('div',{className:'validate-title'},
        '✓ Mapping Validation — Formula Source',
        React.createElement('div',{className:'row',style:{marginLeft:'auto',gap:6}},
          validation.some(v=>v.status==='suggestion'||v.status==='diff')&&
            React.createElement('button',{className:'btn btn-sm',onClick:applyAllSuggestions},'Apply all suggestions'),
          React.createElement('button',{className:'btn-g btn-sm',onClick:()=>{sShowValidate(false);sValidation(null);}},'Close')
        )
      ),
      // Legend
      React.createElement('div',{style:{display:'flex',gap:8,padding:'6px 0 8px',borderBottom:'1px solid var(--bdd)',marginBottom:4,flexWrap:'wrap'}},
        React.createElement('span',{className:'fbadge fbadge-hc'},'✓ Industry standard'),
        React.createElement('span',{className:'fbadge fbadge-db'},'~ DB formula'),
        React.createElement('span',{className:'fbadge fbadge-nil'},'— no formula'),
        React.createElement('span',{style:{fontSize:10,color:'var(--txd)',marginLeft:'auto'}},
          `${validation.filter(v=>v.formulaSrc==='hardcoded').length} hardcoded · ${validation.filter(v=>v.formulaSrc==='db').length} DB · ${validation.filter(v=>v.formulaSrc==='none').length} none`)
      ),
      React.createElement('div',{style:{maxHeight:240,overflowY:'auto'}},
        validation.map((v,i)=>React.createElement('div',{key:i,className:'vrow'},
          React.createElement('span',{className:'vicon'},
            v.status==='ok'||v.status==='custom'?'✓':v.status==='unmapped'?'✗':v.status==='suggestion'?'＋':'≠'
          ),
          React.createElement('span',{className:'vprod',title:v.name},v.name.length>28?v.name.slice(0,26)+'…':v.name),
          React.createElement('span',{className:'vli',style:{flex:1}},
            v.curLI?v.curLI:'(unmapped)'
          ),
          // Formula source badge
          React.createElement('span',{
            className:`fbadge ${v.formulaSrc==='hardcoded'?'fbadge-hc':v.formulaSrc==='db'?'fbadge-db':'fbadge-nil'}`,
            title:v.formulaSrc==='hardcoded'?`Industry standard: ${v.hfLabel}\n${v.hfNote}`:v.formulaSrc==='db'?`DB expr: ${v.formulaExpr}`:'No formula — will use $0 price in package',
          },v.formulaSrc==='hardcoded'?'✓ std':v.formulaSrc==='db'?'~ db':'— nil'),
          React.createElement('span',{className:`vtag ${v.status==='ok'?'vtag-ok':v.status==='unmapped'?'vtag-err':v.status==='suggestion'?'vtag-warn':'vtag-warn'}`},
            v.status==='ok'?'matched':v.status==='unmapped'?'not found':v.status==='suggestion'?'suggestion':'differs'
          )
        ))
      )
    ),

    // ── Per-product rows — READ ONLY (no dropdown) ───────────────────────
    React.createElement('div',{className:'sbox',style:{maxHeight:330}},
      filteredProds.length===0
        ?React.createElement('div',{className:'nodata'},mapFilter?'No products match this filter.':'No products selected.')
        :filteredProds.map(p=>{
          const liId=mappings[p.product_id];
          const li=liId?lineItems.find(l=>l.id===liId):null;
          const tier=normT(fmap[p.product_id]?.family_tier||p.family_tier);
          const hasFormula=!!(li?.formula_expr&&li.formula_type!=='direct_input');
          return React.createElement('div',{key:p.product_id,className:'lir'},
            // Product header
            React.createElement('div',{className:'row'},
              React.createElement('div',{style:{flex:1,minWidth:0}},
                React.createElement('div',{style:{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--tx)'}},p.product_name),
                React.createElement('div',{className:'row',style:{gap:4,marginTop:3}},
                  p.manufacturer_norm&&React.createElement('span',{className:'kpill'},p.manufacturer_norm),
                  p.product_category&&React.createElement('span',{className:'kpill'},p.product_category),
                  tier&&React.createElement('span',{className:tbc(tier)},tier.toUpperCase())
                )
              ),
              liId&&React.createElement('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3}},
                React.createElement('span',{
                  className:'li-ok',
                  style:{background:hasFormula?'var(--ok-bg)':'var(--bg3)',color:hasFormula?'var(--ok-tx)':'var(--txd)',border:`1px solid ${hasFormula?'var(--ok-bd)':'var(--bdd)'}`},
                },hasFormula?'📐 formula':'📋 mapped'),
                hasFormula&&React.createElement('span',{
                  className:`fbadge ${findHardcodedFormula(li?.display_name||'')?'fbadge-hc':'fbadge-db'}`,
                  title:findHardcodedFormula(li?.display_name||'')?`Industry standard: ${findHardcodedFormula(li.display_name).label}`:'Using DB formula_expr',
                },findHardcodedFormula(li?.display_name||'')?'✓ industry std':'~ db formula')
              )

            // Read-only mapping display
            liId
              ?React.createElement('div',{className:'li-readout'},
                  React.createElement('span',{className:'li-readout-name'},li?.display_name||'Unknown line item'),
                  li?.output_uom&&React.createElement('span',{className:'kpill'},li.output_uom),
                  li?.is_gated&&React.createElement('span',{className:'li-gt'},'⚠ '+li.gate_question),

      React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap'}},

          {k:'other',     label:'Other',          hint:'All other formula products'},

              type:'number',min:0,max:50,step:1,
              className:'inp',style:{width:70,textAlign:'right'},

      React.createElement('span',{style:{fontSize:11,color:'var(--am)'}},
