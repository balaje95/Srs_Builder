function Step4({selIds,allProds,fmap,lineItems,mappings,tiers,setTiers,accIds,pkgNames,setPkgNames,onNext,onBack}){
  const[sqft,setSqft]=useState(2200);const[pitch,setPitch]=useState('standard');const[story,setStory]=useState('1');
  // #2 — Package name templates: {brand} and {tier} tokens supported
  const[namesOpen,setNamesOpen]=useState(false);
  const REGIONS_PRESET=[
    {label:'National avg (1.00×)',v:1.00},
    {label:'Northeast / NYC (1.18×)',v:1.18},
    {label:'West Coast / LA (1.15×)',v:1.15},
    {label:'Southeast (0.93×)',v:0.93},
    {label:'Midwest (0.95×)',v:0.95},
    {label:'Texas (0.97×)',v:0.97},
    {label:'Custom',v:'custom'},
  ];

  const selP=useMemo(()=>allProds.filter(p=>selIds.includes(p.product_id)),[allProds,selIds]);
  const accSet=useMemo(()=>new Set(accIds||[]),[accIds]);
  const pkgProds=useMemo(()=>selP.filter(p=>!accSet.has(p.product_id)),[selP,accSet]);
  useEffect(()=>{const t={good:[],better:[],best:[],untiered:[]};pkgProds.forEach(p=>{const tk=normT(fmap[p.product_id]?.family_tier||p.family_tier);if(tk)t[tk].push(p);else t.untiered.push(p);});setTiers(t);},[pkgProds,fmap]);

  // Derive dominant brand from selected products for the {brand} token
  const dominantBrand=useMemo(()=>{
    const counts={};
    pkgProds.forEach(p=>{if(p.manufacturer_norm){counts[p.manufacturer_norm]=(counts[p.manufacturer_norm]||0)+1;}});
    if(!Object.keys(counts).length)return '';
    return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  },[pkgProds]);

  // Resolve {brand} token in name templates
  const resolveName=(tmpl)=>tmpl.replace(/\{brand\}/gi,dominantBrand||'').replace(/\s{2,}/g,' ').trim();

  // Roof calculations (with regional multiplier applied to price)
  const squares=Math.round((sqft/100)*10)/10;
  const pitchMult=PITCH[pitch]||1;
  const storyMult=STORY[story]||1;

  // Price per tier using actual product suggested_prices × UOM-aware qty estimates
  // Falls back to industry rate card if no products have prices
  const calcPrice=useMemo(()=>{
    // Use industry rate cards — reliable and consistent regardless of catalog size.
    // Material cost summing inflates totals when 400+ products are selected because
    // trim/siding/specialty items get roof-area quantities applied incorrectly.
    const result={};
    ['good','better','best'].forEach(tk=>{
      result[tk]=Math.round(RATE_CARDS[tk].rate*squares*pitchMult*storyMult/100)*100;
    });

function App(){
  const[theme,setTheme]=useState('light');
  const[showInfo,sShowInfo]=useState(false);
  const[step,ss]=useState(0);const[mx,smx]=useState(0);
  const[auth,sa]=useState(null);
  const[prods,sP]=useState([]);const[fmap,sF]=useState({});
  const[loaded,sL]=useState(false);const[prog,sPr]=useState(0);
  const[selIds,setSel]=useState([]);
  const[lis,sLis]=useState([]);const[maps,sMaps]=useState({});
  const[tiers,sTiers]=useState({good:[],better:[],best:[],untiered:[]});
  // Waste factor overrides (%) per product category
  const[waste,sWaste]=useState({shingles:12,underlayment:10,starter:5,other:10});
  // Accessories: product_ids marked as accessories — excluded from packages
  const[accIds,sAccIds]=useState(new Set());
  const[pkgNames,sPkgNames]=useState({good:'Good - Essential Protection',better:'Better - Superior Shield',best:'Best - Elite System'});

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);},[theme]);

  const init=useCallback(async()=>{
    const[p,f]=await Promise.all([loadProds(sPr),loadFams()]);
    sP(p);sF(f);sL(true);
  },[]);
  const handleAuth=useCallback(acc=>{sa(acc);ss(1);smx(1);init();},[init]);
  const go=n=>{if(n<=mx)ss(n);};
  const adv=n=>{ss(n);smx(m=>Math.max(m,n));};

  // ── Logout: reset all state back to Step 1 ──
  const logout=useCallback(()=>{
    if(step>0&&!window.confirm('Log out and clear all selections?'))return;
    sa(null);ss(0);smx(0);
    setSel([]);sLis([]);sMaps({});
    sTiers({good:[],better:[],best:[],untiered:[]});
    sWaste({shingles:12,underlayment:10,starter:5,other:10});
    sAccIds(new Set());
    sPkgNames({good:'Good - Essential Protection',better:'Better - Superior Shield',best:'Best - Elite System'});
  },[step]);

  return React.createElement('div',null,
    // Internal tool banner
    React.createElement('div',{className:'internal-banner'},
      React.createElement('svg',{width:14,height:14,viewBox:'0 0 14 14',fill:'none'},
        React.createElement('rect',{x:1,y:1,width:12,height:12,rx:2,stroke:'currentColor',strokeWidth:1.3}),
        React.createElement('path',{d:'M4 7h6M7 4v6',stroke:'currentColor',strokeWidth:1.3,strokeLinecap:'round'})
      ),
      React.createElement('span',null,'Internal Tool — Zuper CPQ Builder'),
      React.createElement('span',{style:{marginLeft:'auto',opacity:.6,fontWeight:400}},new Date().getFullYear()+' · For internal use only')
    ),
    showInfo&&React.createElement(InfoModal,{onClose:()=>sShowInfo(false)}),
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'hd'},
        React.createElement('div',{className:'logo'},'ZUPER'),
        React.createElement('span',{className:'hd-t'},'CPQ Builder — Service Packages'),
        auth&&React.createElement('div',{className:'acc-chip'},React.createElement('div',{className:'acc-dot'}),React.createElement('span',{className:'acc-nm'},auth.name)),
        auth&&React.createElement('button',{
          className:'theme-btn',
          onClick:logout,
          style:{color:'var(--er-tx)',borderColor:'rgba(248,113,113,.3)',background:'rgba(248,113,113,.06)'},
          title:'Log out and return to Step 1',
        },'⏻ Logout'),
        React.createElement('button',{
          className:'theme-btn',
          onClick:()=>sShowInfo(true),
          style:{fontWeight:600},
          title:'Open step-by-step reference guide',
        },'ℹ Guide'),
        React.createElement('button',{className:'theme-btn',onClick:()=>setTheme(t=>t==='dark'?'light':'dark')},theme==='dark'?'☀ Light mode':'🌙 Dark mode')
      ),
      React.createElement(Steps,{step,maxStep:mx,setStep:go}),
      React.createElement('div',{className:'body'},
        step===0&&React.createElement(Step1,{onSuccess:handleAuth}),
        step===1&&React.createElement(Step2,{onNext:()=>adv(2),selIds,setSelIds:setSel,allProds:prods,fmap,prodsLoaded:loaded,loadProgress:prog}),
        step===2&&React.createElement(Step3,{selIds,allProds:prods,fmap,lineItems:lis,setLineItems:sLis,mappings:maps,setMappings:sMaps,waste,setWaste:sWaste,accIds,setAccIds:sAccIds,onNext:()=>adv(3),onBack:()=>ss(1)}),
        step===3&&React.createElement(Step4,{selIds,allProds:prods,fmap,lineItems:lis,mappings:maps,tiers,setTiers:sTiers,accIds,pkgNames,setPkgNames:sPkgNames,onNext:()=>adv(4),onBack:()=>ss(2)}),
        step===4&&React.createElement(Step5,{auth,selIds,allProds:prods,lineItems:lis,mappings:maps,tiers,fmap,waste,accIds,pkgNames,onBack:()=>ss(3)})
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
